name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml  # zizmor: ignore[self-repository] actionlint lacks $/ support.

  release:
    # Firmware remains experimental until the separate hardware gate passes.
    if: github.event_name == 'push'
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.1
          install_args: go goreleaser github:go-semantic-release/semantic-release
          cache: false
      - name: Configure tag authentication
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
      - name: Create semantic version tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: semantic-release --provider git --provider-opt default_branch=main
      - name: Publish release artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git tag --points-at HEAD | grep -qE '^v[0-9]+\.'; then
            goreleaser release --clean
          fi
