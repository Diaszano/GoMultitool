name: Recovery image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.1
          install_args: go
          cache: false
      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools fdisk binutils multistrap ntfs-3g parted \
            qemu-user-static squashfs-tools util-linux xz-utils
      - name: Validate image fixtures
        run: sudo --preserve-env=PATH bash tests/integration/image_build_test.sh
      - name: Test hardware release gate
        run: bash tests/policy/release_manifest_test.sh
      - name: Build and validate recovery image
        run: sudo --preserve-env=PATH make image
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: recovery-image-experimental-${{ github.sha }}
          path: |
            image-dist/*.img.xz
            image-dist/*.sha256
            image-dist/*.manifest.json
          if-no-files-found: error
