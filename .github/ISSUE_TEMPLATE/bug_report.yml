name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the exact steps and expected result.
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Board and storage device
      description: Include model, SoC, and whether the device was physically written.
    validations:
      required: false
