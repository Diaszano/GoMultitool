version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - durationcheck
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - revive
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Diaszano/GoMultitool
