version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - durationcheck
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - revive
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true

formatters:
  enable:
    - gci
    - gofumpt
    - golines
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/Diaszano/GoMultitool)
    gofumpt:
      module-path: github.com/Diaszano/GoMultitool
